name: Build KistiGuard Apps (Client Lock & Dealer Hub)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APKs
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/KistiGuard-Customer-Lock.apk
          fi
          if [ -f dealer/build/outputs/apk/debug/dealer-debug.apk ]; then
            cp dealer/build/outputs/apk/debug/dealer-debug.apk release-apks/KistiGuard-Dealer-Hub.apk
          fi

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KistiGuard-APKs-Customer-and-Dealer
          path: release-apks/*.apk
          retention-days: 30
