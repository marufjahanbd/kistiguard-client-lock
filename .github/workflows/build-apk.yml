name: Build KistiGuard Apps (Client Lock & Dealer Hub)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APKs
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APKs for Upload
        if: always()
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} release-apks/KistiGuard-Customer-Lock.apk \; 2>/dev/null || true
          find dealer/build/outputs/apk/ -name "*.apk" -type f -exec cp {} release-apks/KistiGuard-Dealer-Hub.apk \; 2>/dev/null || true
          ls -la release-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KistiGuard-APKs-Customer-and-Dealer
          path: release-apks/*.apk
          retention-days: 30
